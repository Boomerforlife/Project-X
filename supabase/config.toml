# Supabase CLI config (local stack). Only used by `supabase start` / `supabase db reset`.
# Offline development uses @projectx/db (PGlite) and does not need this file.
project_id = "projectx"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[studio]
enabled = true
port = 54323

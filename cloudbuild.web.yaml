# Builds the web image with Dockerfile.web (its own ignore file; the root .dockerignore is for the API).
substitutions:
  _REGION: asia-south1
  _REPO: projectx
  _TAG: web-staging-1
  _API_BASE_URL: https://projectx-api-989800061583.asia-south1.run.app/api/v1
  _SUPABASE_URL: https://gardheietftxyforposh.supabase.co
  _SUPABASE_PUBLISHABLE_KEY: ""
  _SITE_URL: ""
  _AUTH_GOOGLE: "off"
  # Ads stay off until AdSense units exist (docs/MONETIZATION_HANDOVER.md section 5). The publisher id is built in.
  _ADS: "off"
  _ADSENSE_CLIENT: ""
  _ADSENSE_SLOT_DISPLAY: ""
  _ADSENSE_SLOT_INFEED: ""
  _ADSENSE_INFEED_LAYOUT_KEY: ""
  _ADSENSE_SLOT_MULTIPLEX: ""
  _GAM_REWARDED_UNIT: ""
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - -f
      - Dockerfile.web
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${_TAG}
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_SUPABASE_PUBLISHABLE_KEY}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_AUTH_GOOGLE=${_AUTH_GOOGLE}
      - --build-arg=NEXT_PUBLIC_ADS=${_ADS}
      - --build-arg=NEXT_PUBLIC_ADSENSE_CLIENT=${_ADSENSE_CLIENT}
      - --build-arg=NEXT_PUBLIC_ADSENSE_SLOT_DISPLAY=${_ADSENSE_SLOT_DISPLAY}
      - --build-arg=NEXT_PUBLIC_ADSENSE_SLOT_INFEED=${_ADSENSE_SLOT_INFEED}
      - --build-arg=NEXT_PUBLIC_ADSENSE_INFEED_LAYOUT_KEY=${_ADSENSE_INFEED_LAYOUT_KEY}
      - --build-arg=NEXT_PUBLIC_ADSENSE_SLOT_MULTIPLEX=${_ADSENSE_SLOT_MULTIPLEX}
      - --build-arg=NEXT_PUBLIC_GAM_REWARDED_UNIT=${_GAM_REWARDED_UNIT}
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${_TAG}
# Runs as the images-only build account (not the default compute account, which has Editor on the project).
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/projectx-build@${PROJECT_ID}.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY

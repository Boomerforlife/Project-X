# ProjectX API Worker. Nothing here is deployed automatically.
# Every `wrangler deploy`, `wrangler secret put`, bucket creation, route or DNS change REQUIRES APPROVAL (see docs/DEPLOYMENT.md).
# Local check without an account:  npm run deploy:dry -w @projectx/api

name = "projectx-api-dev"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Workers Caching (tag purge via the Workers runtime). VERIFY plan/account availability before relying on it.
# If it is unavailable, set CACHE_MODE = "cache_api" in [vars] (API mounts edgeCacheMiddleware) and use
# CACHE_PURGE_DRIVER = "zone_api" for tag purges, or remove this table.
[cache]
enabled = true

# ---- R2 bindings (buckets must exist first: `wrangler r2 bucket create ...` REQUIRES APPROVAL) ----
[[r2_buckets]]
binding = "SOURCE_DOCS"
bucket_name = "projectx-source-docs"

[[r2_buckets]]
binding = "PUBLIC_ASSETS"
bucket_name = "projectx-public-assets"

[[r2_buckets]]
binding = "USER_UPLOADS"
bucket_name = "projectx-user-uploads"

# Namespace ids: 1001-1006 dev (top-level), 2001-2006 staging, 3001-3006 production (separate counters per environment).
# ---- Rate limiting bindings (limit per 60 s; values = rateLimitDefaults in @projectx/edge) ----
[[ratelimits]]
name = "RL_PUBLIC"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_SEARCH"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_ATTEMPTS"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_DOUBTS"
namespace_id = "1005"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_ADMIN"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

# ---- Optional Hyperdrive (enable when DB latency/cold connections hurt; see COST_STRATEGY section 5) ----
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-config-id>"

# ---- Non-secret defaults ----
[vars]
APP_ENV = "development"
LOG_LEVEL = "info"
DB_DRIVER = "postgres"
AUTH_MODE = "jwks"
SUPABASE_URL = ""
SUPABASE_JWT_ISSUER = ""
CORS_ALLOWED_ORIGINS = ""
ENABLE_API_DOCS = "false"
PUBLIC_ASSETS_BASE_URL = ""
FILES_BASE_URL = ""
STORAGE_DRIVER = "r2"
CACHE_PURGE_DRIVER = "workers"
CACHE_MODE = "workers"
RATE_LIMIT_DRIVER = "cloudflare"
CF_ZONE_ID = ""
R2_BUCKET_SOURCE_DOCS = "projectx-source-docs"
R2_BUCKET_PUBLIC_ASSETS = "projectx-public-assets"
R2_BUCKET_USER_UPLOADS = "projectx-user-uploads"

# ---- Secrets: never put in this file. Set with `wrangler secret put <NAME> [--env <env>]` (REQUIRES APPROVAL) ----
#   DATABASE_URL          Supavisor transaction pooler URL (port 6543) -- or use the HYPERDRIVE binding
#   SIGNING_SECRET        HMAC secret for signed private file URLs
#   IP_HASH_SECRET        HMAC secret for IP hashing
#   CF_API_TOKEN_PURGE    token scoped to Cache Purge only (only when CACHE_PURGE_DRIVER = zone_api | both)
#   SUPABASE_JWT_SECRET   only when AUTH_MODE = hs256
#   WEB_REVALIDATE_SECRET shared with the web app's REVALIDATE_SECRET (set WEB_REVALIDATE_URL as a var; both optional)
# Never set on the Worker: GEMINI_API_KEY, R2_* S3 keys, service-role key (operator machine only).

# =====================================================================================================
# Environments. Wrangler does NOT inherit bindings/vars into [env.*]; they are repeated on purpose.
# No `routes` / `workers_dev` route is active: attaching api.<domain> is a DNS/route change that REQUIRES APPROVAL.
# =====================================================================================================


# Builds the ingestion workers image with Dockerfile.workers (ignore file: .gcloudignore.workers).
substitutions:
  _REGION: asia-south1
  _REPO: projectx
  _TAG: workers-1
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.workers", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/workers:${_TAG}", "."]
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/workers:${_TAG}
# Runs as the images-only build account (not the default compute account, which has Editor on the project).
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/projectx-build@${PROJECT_ID}.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
